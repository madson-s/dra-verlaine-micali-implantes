<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smile Badge</title>
  <style>
    /* ── Layout ── */
    .smile-badge-host {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3.5rem 0;
    }

    /* ── Badge wrapper ── */
    .smile-badge {
      position: relative;
      width: 180px;
      height: 180px;
      cursor: pointer;
    }
    .smile-badge svg {
      overflow: visible;
    }

    /* ── Background starburst ── */
    .smile-bg-shape {
      transform-origin: 64px 64px;
      transform: scale(0.92);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .smile-bg-shape.spinning {
      animation: smile-spin 12s linear infinite;
    }

    /* ── Face ── */
    .smile-face-group {
      opacity: 0;
      transform-origin: 63.5px 65px;
      transform: scale(0.2) rotate(-20deg);
      transition:
        opacity  0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0s,
        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0s;
    }
    .smile-badge:hover .smile-face-group {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    /* ── Circular text ── */
    .smile-text-group {
      opacity: 0;
      transition: opacity 0.01s linear 0.52s;
    }
    .smile-badge:hover .smile-text-group {
      opacity: 1;
    }

    .smile-text-reveal-mask {
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0s;
    }
    .smile-badge:hover .smile-text-reveal-mask {
      transform: scaleX(1);
      transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1) 0.54s;
    }

    /* ── Spin keyframe ── */
    @keyframes smile-spin {
      from { transform: rotate(0deg)   scale(1); }
      to   { transform: rotate(360deg) scale(1); }
    }
  </style>
</head>

<script>
  const badge = document.getElementById('smileBadge');
  const bgShape = document.getElementById('smileBgShape');
  let spinTimeout = null;
  let isHovered = false;

  badge.addEventListener('mouseenter', () => {
    isHovered = true;
    clearTimeout(spinTimeout);
    spinTimeout = setTimeout(() => {
      if (isHovered) bgShape.classList.add('spinning');
    }, 480);
  });

  badge.addEventListener('mouseleave', () => {
    isHovered = false;
    clearTimeout(spinTimeout);
    const matrix = new DOMMatrix(window.getComputedStyle(bgShape).transform);
    const angle = Math.round(Math.atan2(matrix.b, matrix.a) * (180 / Math.PI));
    bgShape.classList.remove('spinning');
    bgShape.style.transform = `rotate(${angle}deg) scale(0.92)`;
    bgShape.style.transition = 'transform 0.6s cubic-bezier(0.34,1.56,0.64,1)';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        bgShape.style.transform = 'rotate(0deg) scale(0.92)';
      });
    });
  });
</script>
